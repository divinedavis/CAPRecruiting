# Fail2Ban filter: ban clients requesting server-side script extensions that this
# stack does not and will never serve (PHP/ASP/JSP/CGI/Perl).
#
# caprecruiting.com is a Python/Flask app. There is no PHP binary and no php-fpm
# service on the host, so any request for one of these is unambiguously hostile —
# webshell hunting (/fff.php, /xiugai.php), WordPress filemanager exploits, etc.
# Safe to ban aggressively: a legitimate client has no reason to ask for these.

[Definition]

failregex = ^<HOST> \- \S+ \[\] "(GET|POST|HEAD)[^"]*\.(php\d?|phtml|phar|asp|aspx|jsp|jspx|cgi|pl)([?#/][^"]*)?" \d+ .*$

ignoreregex =

datepattern = ^[^\[]*\[({DATE})
              {^LN-BEG}
