# Fail2Ban filter: ban clients probing for credential, VCS-metadata and config
# files. This is the "quiet scanner" signature that the other jails miss.
#
# Context (2026-08-20): a scanner walked caprecruiting.com asking for /.env,
# /.git/HEAD, /.git/config, /.aws/credentials, /config.json, /js/config.js,
# /backend/.env and /api/.env, rotating its User-Agent on every request. It was
# never banned: it produced 12 x 404 in the busiest 60s window against
# nginx-404-flood's maxretry=30, and 2 limit_req events against nginx-limit-req's
# maxretry=10. Calibrated under every existing threshold, it probed freely.
#
# Unlike a 404 flood this needs no volume threshold to be trustworthy. No browser,
# crawler or API client has a reason to ask for a dotfile of secrets, so the jail
# bans on 2 strikes. Matched on path only, NOT on status code — if one of these
# ever stops 404ing, that is exactly when the ban matters most.

[Definition]

failregex = ^<HOST> \- \S+ \[\] "(GET|POST|HEAD|PUT|PATCH|DELETE|OPTIONS)[^"]*/(\.env|\.git/|\.aws/|\.ssh/|\.svn/|\.hg/|\.bzr/|\.npmrc|\.netrc|\.htpasswd|\.pgpass|\.DS_Store|\.vscode/|\.idea/|id_rsa|id_ed25519|docker-compose\.ya?ml|config\.json|js/config\.js|wp-config|server-status|actuator/env|phpinfo)[^"]*" \d+ .*$

ignoreregex =

datepattern = ^[^\[]*\[({DATE})
              {^LN-BEG}
