# Fail2Ban filter: ban clients generating a flood of 404s (vulnerability scanners).
# Tuned for caprecruiting.com — a Node/React app. Threshold is set high enough in
# jail.d/nginx-caprecruiting.local that ordinary users hitting a few missing assets
# are never caught.

[Definition]

failregex = ^<HOST> \- \S+ \[\] "(GET|POST|HEAD|PUT|PATCH|DELETE|OPTIONS)[^"]*" 404 .*$

ignoreregex =

datepattern = ^[^\[]*\[({DATE})
              {^LN-BEG}
