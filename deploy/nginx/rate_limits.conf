limit_req_zone $binary_remote_addr zone=cap_auth:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=cap_general:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=cap_sensitive:10m rate=5r/s;

# Static assets get their own budget. The homepage marquee renders one <img> per
# partner school (146 as of 2026-09-12), so a single page load is a ~155-request
# burst. Sharing cap_general meant the tail 429d and fail2ban banned the visitor
# for 24h (see the /static/ location in sites-enabled/caprecruiting).
limit_req_zone $binary_remote_addr zone=cap_static:10m rate=100r/s;
