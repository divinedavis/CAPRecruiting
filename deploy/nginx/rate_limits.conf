limit_req_zone $binary_remote_addr zone=cap_auth:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=cap_general:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=cap_sensitive:10m rate=5r/s;

# Static assets get their own budget. The homepage marquee renders one <img> per
# partner school (146 as of 2026-09-12), so a single page load is a ~155-request
# burst. Sharing cap_general meant the tail 429d and fail2ban banned the visitor
# for 24h (see the /static/ location in sites-enabled/caprecruiting).
limit_req_zone $binary_remote_addr zone=cap_static:10m rate=100r/s;

# Scanners and scrapers that never send a real user-agent or ignore robots.txt.
# Matched clients get a 444 (connection closed, no response). Search engines,
# ClaudeBot/GPTBot (they honour robots.txt, which already disallows /dashboard)
# and link-preview fetchers (Go-http-client, aiohttp, okhttp pull og:image for
# shared links) are deliberately NOT listed. Picked from 14 days of
# bearcats-access.log on 2026-09-12: empty UA was 100% wp/php probes.
map $http_user_agent $cap_bad_bot {
    default 0;
    ""      1;
    "~*(bytespider|mj12bot|ahrefsbot|semrushbot|dotbot|dataforseobot|petalbot|blexbot|lohisoftbot|libredtail|vitesweep|zgrab|masscan|nuclei|sqlmap|nikto|nmap|censysinspect|l9explore|python-urllib|scrapy)" 1;
}

# Player directory (/dashboard, /profile/<handle>) lists minors' names and is
# public on purpose, so the defence is pace, not a login wall. 1 page/s with a
# burst of 20 is far beyond a person clicking through profiles; a scraper walking
# all ~60 profiles trips 429s, and nginx-limit-req (10 in 60s) bans it for 24h.
# The box itself (feature-walk / apps-check / alert probes) is exempt: an empty
# key is not counted by limit_req.
geo $cap_internal {
    default          0;
    127.0.0.1        1;
    167.71.170.219   1;
}
map $cap_internal $cap_directory_key {
    0 $binary_remote_addr;
    1 "";
}
limit_req_zone $cap_directory_key zone=cap_directory:10m rate=1r/s;
