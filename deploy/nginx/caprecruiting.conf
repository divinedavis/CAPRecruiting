server {
    listen 80;
    server_name caprecruiting.com www.caprecruiting.com;
    if ($cap_bad_bot) { return 444; }
    return 301 https://caprecruiting.com$request_uri;
}
server {
    listen 443 ssl;
    listen [::]:443 ssl ipv6only=on;
    server_name www.caprecruiting.com;
    ssl_certificate /etc/letsencrypt/live/caprecruiting.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/caprecruiting.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    return 301 https://caprecruiting.com$request_uri;
}
server {
    listen 443 ssl;
    server_name caprecruiting.com;
    ssl_certificate /etc/letsencrypt/live/caprecruiting.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/caprecruiting.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Security headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://js.stripe.com https://www.google-analytics.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https://*.digitaloceanspaces.com https://*.cdn.digitaloceanspaces.com https://api.dicebear.com; frame-src https://js.stripe.com https://hooks.stripe.com blob:; connect-src 'self' wss://caprecruiting.com https://api.stripe.com; media-src 'self' https://*.digitaloceanspaces.com https://*.cdn.digitaloceanspaces.com;" always;

    # Every route used to carry client_max_body_size 4g, so a POST of any size
    # reached uvicorn. The pinned starlette (0.52.1, held back because 1.x breaks
    # the templates) ignores request.form() size limits for
    # application/x-www-form-urlencoded, so a multi-GB form body to /login would
    # be buffered in memory - GHSA high, unfixable by upgrading here. 5m is the
    # default for everything; the upload routes below override it.
    client_max_body_size 5m;

    # Known scanners/scrapers and empty user-agents (map in conf.d/rate_limits.conf)
    if ($cap_bad_bot) { return 444; }

    # Strict rate limit for auth endpoints: 5 requests/min per IP
    location ~ ^/(login|signup|forgot-password) {
        limit_req zone=cap_auth burst=5 nodelay;
        limit_req_status 429;

        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection upgrade;
        proxy_read_timeout 86400;
        proxy_send_timeout 3600;
    }


    # Rate limit for messaging endpoints: 10 requests/min per IP
    location ~ ^/messages/.+/send {
        limit_req zone=cap_auth burst=3 nodelay;
        limit_req_status 429;

        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection upgrade;
        proxy_read_timeout 86400;
        proxy_send_timeout 3600;
    }

    # Rate limit for admin endpoints: 10 requests/min per IP
    location ~ ^/admin/ {
        limit_req zone=cap_sensitive burst=5 nodelay;
        limit_req_status 429;

        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection upgrade;
        proxy_read_timeout 86400;
        proxy_send_timeout 3600;
    }

    # Rate limit for signing and join/bypass endpoints: 5 requests/min per IP
    location ~ ^/(sign|join)/ {
        limit_req zone=cap_auth burst=3 nodelay;
        limit_req_status 429;

        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection upgrade;
        proxy_read_timeout 86400;
        proxy_send_timeout 3600;
    }

    # Rate limit for upload endpoints: 5 requests/min per IP
    location ~ ^/(profile/(upload-photo|upload-committed-logo|videos/upload|images/upload|transcripts/upload)|dashboard/scout/card/[^/]+/image) {
        limit_req zone=cap_auth burst=3 nodelay;
        limit_req_status 429;

        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection upgrade;
        proxy_read_timeout 86400;
        client_max_body_size 4g;
        proxy_send_timeout 3600;
    }

    # Player directory: paced against scraping (zone notes in conf.d/rate_limits.conf).
    # Sits after the upload regex so /profile/upload-* keeps its own limits.
    location ~ ^/(dashboard|profile/[^/]+)$ {
        limit_req zone=cap_directory burst=20 nodelay;
        limit_req_status 429;

        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection upgrade;
        proxy_read_timeout 86400;
        proxy_send_timeout 3600;
    }

    # Rate limit for password reset: 3 requests/min per IP
    location ~ ^/reset-password {
        limit_req zone=cap_auth burst=2 nodelay;
        limit_req_status 429;

        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection upgrade;
        proxy_read_timeout 86400;
        proxy_send_timeout 3600;
    }

    # Legacy local profile photos. static/uploads/ is mode 750 (bearcats only),
    # deliberately: user-uploaded content stays owned by the app, so this one
    # subtree keeps being served by uvicorn's StaticFiles mount rather than read
    # off disk by nginx. It shares the cap_static budget so a photo-heavy roster
    # page cannot trip the fail2ban ban either. Declared before /static/ and with
    # ^~ so it wins the prefix match. New uploads go to DO Spaces; these are the
    # pre-migration leftovers.
    location ^~ /static/uploads/ {
        limit_req zone=cap_static burst=300 nodelay;
        limit_req_status 429;

        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
    }

    # Static assets: served straight from disk by nginx instead of proxied to
    # uvicorn, on their own rate-limit budget. The homepage marquee renders one
    # <img> per partner school (146 of them on 2026-09-12), so one page load is
    # a ~155 request burst. Against cap_general (30r/s, burst 50) the tail 429d
    # - the page HTML included - and fail2bans nginx-limit-req jail banned the
    # visitor for 24h. cap_static absorbs a full page load and still bounds a
    # scraper. Only `expires` is set here: an add_header in this block would
    # drop the inherited server-level security headers.
    location /static/ {
        limit_req zone=cap_static burst=300 nodelay;
        limit_req_status 429;

        root /home/recruiting/bearcats;
        try_files $uri =404;
        expires 30d;

        # Editor and deploy leftovers live in this tree (style.css.bak-adminmenu,
        # scout.css.bak-laneedit, ...). The app's StaticFiles mount served them
        # too, and .bak is exactly what the scanners this box already fail2bans
        # go looking for. Declared first so it wins the regex match over the
        # css/js rule below.
        location ~* \.(?:bak[^/]*|orig|save|swp|swo|tmp|old|dist)$ {
            deny all;
        }

        # Images and fonts are fine pinned for a month, but not every code
        # reference is cache-busted - templates version style.css and scout.css
        # with ?v=, college-data.js has no version at all - so a 30d cache would
        # strand returning visitors on stale JS after a deploy. Revalidate these
        # hourly; the ETag makes the refresh a 304 in the common case.
        location ~* \.(?:css|js)$ {
            limit_req zone=cap_static burst=300 nodelay;
            limit_req_status 429;

            root /home/recruiting/bearcats;
            try_files $uri =404;
            expires 1h;
        }
    }

    # General traffic: 30 req/s with burst of 50 (see conf.d/rate_limits.conf)
    location / {
        limit_req zone=cap_general burst=50 nodelay;
        limit_req_status 429;

        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection upgrade;
        proxy_read_timeout 86400;
        proxy_send_timeout 3600;
    }

    access_log /var/log/nginx/bearcats-access.log cap_sanitized;
    error_log /var/log/nginx/bearcats-error.log;
}
